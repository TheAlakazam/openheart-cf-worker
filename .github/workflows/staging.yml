name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  pull_request:
    types: [ labeled ]

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || contains(github.event.label.name, 'deploy:staging')
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Workers (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

      - name: Run smoke tests against staging
        run: |
          sleep 10  # Wait for deployment to propagate
          echo "Running basic smoke tests..."
          
          # Test GET endpoint
          curl -f "https://openheart-reactions-api-staging.${{ secrets.CLOUDFLARE_SUBDOMAIN || 'your-subdomain' }}.workers.dev/reactions/test-post" || exit 1
          
          # Test CORS
          curl -f -X OPTIONS "https://openheart-reactions-api-staging.${{ secrets.CLOUDFLARE_SUBDOMAIN || 'your-subdomain' }}.workers.dev/reactions/test-post" || exit 1
          
          echo "✅ Smoke tests passed!"

      - name: Comment PR with staging deployment
        if: github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Staging Deployment Complete!**
              
              Your changes have been deployed to the staging environment:
              
              **Staging URL:** https://openheart-reactions-api-staging.${{ secrets.CLOUDFLARE_SUBDOMAIN || 'your-subdomain' }}.workers.dev
              
              **Test Endpoints:**
              - GET: \`/reactions/test-post\`
              - POST: \`/reactions/test-post\` (with JSON body: \`{"reaction": "heart"}\`)
              
              **Next Steps:**
              - Test your changes thoroughly in staging
              - Once ready, merge to \`main\` for production deployment`
            })