name: Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_call:
    # Allow other workflows to call this one

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test-and-preview:
    name: Test & Deploy Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript compilation
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Validate wrangler.toml
        run: npx wrangler deploy --dry-run

      - name: Deploy Preview (PRs only)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        id: deploy-preview
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --compatibility-date=2024-01-01

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request' && steps.deploy-preview.conclusion == 'success'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref.toLowerCase().replace(/[^a-z0-9]/g, '-');
            const previewUrl = `https://openheart-reactions-api.${branchName}.piyushjaipuriyar.workers.dev`;
            
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Preview Deployment Ready!**
                
                Your changes have been deployed to a preview environment:
                
                **Preview URL:** ${previewUrl}
                
                **Test Endpoints:**
                - GET: \`/reactions/test-post\`
                - POST: \`/reactions/test-post\` (with JSON body: \`{"reaction": "heart"}\`)
                
                **Note:** This preview will automatically update with new commits to this PR.
                
                ✅ All tests passed • 🔍 Ready for review`
              });
              console.log('✅ PR comment posted successfully');
            } catch (error) {
              console.log('ℹ️  Could not post PR comment (permissions may be limited)');
              console.log(`🌐 Preview URL: ${previewUrl}`);
            }