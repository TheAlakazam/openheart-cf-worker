name = "openheart-reactions-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# KV namespaces - MUST be configured before deployment
# Run these commands to create namespaces:
#   wrangler kv:namespace create "REACTIONS"
#   wrangler kv:namespace create "REACTIONS" --preview
#   wrangler kv:namespace create "RATE_LIMITS"  
#   wrangler kv:namespace create "RATE_LIMITS" --preview
# Then replace the IDs below with the output from those commands

# Uncomment and update with your actual namespace IDs:
# [[kv_namespaces]]
# binding = "REACTIONS"
# id = "your-production-reactions-namespace-id"
# preview_id = "your-preview-reactions-namespace-id"

# [[kv_namespaces]]
# binding = "RATE_LIMITS"
# id = "your-production-rate-limits-namespace-id"
# preview_id = "your-preview-rate-limits-namespace-id"

# Environment variables
[vars]
MAX_REACTIONS_PER_POST_PER_DAY = "3"
MAX_REACTIONS_PER_IP_PER_HOUR = "10"
REACTION_COOLDOWN_SECONDS = "0.5"